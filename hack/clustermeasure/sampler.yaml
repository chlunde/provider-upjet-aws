apiVersion: v1
kind: Service
metadata: {name: provider-metrics, namespace: mem}
spec:
  selector: {app: provider-aws-s3}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: sampler, namespace: mem}
data:
  sample.sh: |
    #!/bin/sh
    OUT=/hostout/samples.tsv
    [ -f "$OUT" ] || printf "epoch\tarm\tuptime_s\tnMR\tVmRSS_kB\tVmHWM_kB\tanon_kB\tprivclean_kB\tcg_current_kB\tcg_anon_kB\tcg_active_anon_kB\tcg_anon_thp_kB\tcg_file_kB\tcg_inactive_file_kB\tcg_peak_kB\theapalloc_kB\theapinuse_kB\theapidle_kB\theapreleased_kB\theapsys_kB\tgosys_kB\tgoroutines\tnextgc_kB\n" > $OUT
    while true; do
      pid=$(pgrep -f "/opt/provider/provider" | head -1)
      if [ -n "$pid" ]; then
        arm=$(tr '\0' '\n' < /proc/$pid/environ | sed -n 's/^ARM=//p')
        [ -z "$arm" ] && arm=unknown
        start_ticks=$(awk '{print $22}' /proc/$pid/stat)
        btime=$(awk '/^btime/{print $2}' /proc/stat)
        hz=100
        pstart=$((btime + start_ticks / hz))
        now=$(date +%s)
        up=$((now - pstart))
        rss=$(awk '/^VmRSS/{print $2}' /proc/$pid/status)
        hwm=$(awk '/^VmHWM/{print $2}' /proc/$pid/status)
        anon=$(awk '/^Anonymous/{print $2}' /proc/$pid/smaps_rollup)
        pclean=$(awk '/^Private_Clean/{print $2}' /proc/$pid/smaps_rollup)
        cg=$(awk -F: '{print $3}' /proc/$pid/cgroup | head -1)
        b=/hostcgroup$cg
        cur=$(cat $b/memory.current 2>/dev/null || echo 0)
        peak=$(cat $b/memory.peak 2>/dev/null || echo 0)
        cganon=$(awk '/^anon /{print $2}' $b/memory.stat 2>/dev/null || echo 0)
        cgaanon=$(awk '/^active_anon /{print $2}' $b/memory.stat 2>/dev/null || echo 0)
        cgthp=$(awk '/^anon_thp /{print $2}' $b/memory.stat 2>/dev/null || echo 0)
        cgfile=$(awk '/^file /{print $2}' $b/memory.stat 2>/dev/null || echo 0)
        cginf=$(awk '/^inactive_file /{print $2}' $b/memory.stat 2>/dev/null || echo 0)
        M=$(wget -q -O- -T5 http://provider-metrics.mem.svc.cluster.local:8080/metrics 2>/dev/null)
        gv() { echo "$M" | awk -v k="$1" '$1==k{printf "%.0f", $2/1024}'; }
        ha=$(gv go_memstats_heap_alloc_bytes); hi=$(gv go_memstats_heap_inuse_bytes)
        hid=$(gv go_memstats_heap_idle_bytes); hr=$(gv go_memstats_heap_released_bytes)
        hs=$(gv go_memstats_heap_sys_bytes); gs=$(gv go_memstats_sys_bytes)
        ng=$(gv go_memstats_next_gc_bytes)
        gor=$(echo "$M" | awk '$1=="go_goroutines"{printf "%.0f", $2}')
        nmr=$(/hostbin/kubectl get buckets.s3.aws.upbound.io --no-headers 2>/dev/null | wc -l | tr -d ' ')
        printf "%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n" \
          "$now" "$arm" "$up" "$nmr" "$rss" "$hwm" "$anon" "$pclean" "$((cur/1024))" "$((cganon/1024))" "$((cgaanon/1024))" "$((cgthp/1024))" "$((cgfile/1024))" "$((cginf/1024))" "$((peak/1024))" \
          "$ha" "$hi" "$hid" "$hr" "$hs" "$gs" "$gor" "$ng" >> $OUT
      fi
      sleep 20
    done
---
apiVersion: v1
kind: Pod
metadata: {name: sampler, namespace: mem}
spec:
  serviceAccountName: provider-aws-s3
  hostPID: true
  restartPolicy: Never
  containers:
  - name: sampler
    image: alpine:3.22
    command: ["/bin/sh", "/app/sample.sh"]
    securityContext: {privileged: true}
    volumeMounts:
    - {name: app, mountPath: /app}
    - {name: cgroup, mountPath: /hostcgroup, readOnly: true}
    - {name: out, mountPath: /hostout}
    - {name: bin, mountPath: /hostbin, readOnly: true}
    env:
    - {name: KUBECONFIG, value: ""}
  volumes:
  - {name: app, configMap: {name: sampler}}
  - {name: cgroup, hostPath: {path: /sys/fs/cgroup}}
  - {name: out, hostPath: {path: /provider-bin}}
  - {name: bin, hostPath: {path: /provider-bin}}
