apiVersion: v1
kind: ConfigMap
metadata: {name: tagshim, namespace: mem}
data:
  shim.py: |
    import http.server, socketserver, sys
    BODY = b'<?xml version="1.0" encoding="UTF-8"?>\n<ListTagsForResourceResult xmlns="http://awss3control.amazonaws.com/doc/2018-08-20/"><Tags/></ListTagsForResourceResult>'
    class H(http.server.BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        def _r(self, body=BODY):
            self.send_response(200)
            self.send_header("Content-Type", "application/xml")
            self.send_header("Content-Length", str(len(body)))
            self.send_header("x-amz-request-id", "shim")
            self.end_headers()
            self.wfile.write(body)
        def do_GET(self): self._r()
        def do_PUT(self):
            n = int(self.headers.get("Content-Length") or 0)
            self.rfile.read(n)
            self._r(b'')
        def do_POST(self): self.do_PUT()
        def do_DELETE(self): self._r(b'')
        def log_message(self, f, *a): sys.stderr.write("shim %s %s\n" % (self.command, self.path))
    socketserver.ThreadingTCPServer.allow_reuse_address = True
    with socketserver.ThreadingTCPServer(("", 4566), H) as s:
        s.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tagshim, namespace: mem}
spec:
  replicas: 1
  selector: {matchLabels: {app: tagshim}}
  template:
    metadata: {labels: {app: tagshim}}
    spec:
      containers:
      - name: shim
        image: python:3.13-alpine
        command: ["python3", "/app/shim.py"]
        ports: [{containerPort: 4566}]
        volumeMounts: [{name: app, mountPath: /app}]
      volumes:
      - name: app
        configMap: {name: tagshim}
---
apiVersion: v1
kind: Service
metadata: {name: tagshim, namespace: mem}
spec:
  selector: {app: tagshim}
  ports: [{port: 4566, targetPort: 4566}]
